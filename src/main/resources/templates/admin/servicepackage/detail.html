<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mazer Admin Dashboard</title>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/admin/css/bootstrap.css}">

    <link rel="stylesheet" th:href="@{/admin/vendors/iconly/bold.css}">

    <link rel="stylesheet" th:href="@{/admin/vendors/perfect-scrollbar/perfect-scrollbar.css}">
    <link rel="stylesheet" th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/admin/css/app.css}">
    <link rel="shortcut icon" th:href="@{/admin/images/favicon.svg}" type="image/x-icon">
    <link rel="stylesheet"  th:href="@{/admin/vendors/simple-datatables/style.css}">
    <style>
        .thong-tin-dich-vu{
            margin: 50px;
            display: flex;
            box-shadow: 5px 5px 10px 2px rgba(220, 217, 217, 0.5);
            border-radius: 10px;
            padding: 15px;
            background: #ffffff;
            border: 1px solid #435ebe ;
        }
        .thong-tin-dich-vu .thong-tin-ca-nhan{
            margin: 5px;
            display: flex;
            min-width:400px;


        }
        .thong-tin-dich-vu .thong-tin-ca-nhan div{
            margin: 3px 0;
            padding: 0 10px 0 0;
            width:350px;
        }
        .thong-tin-dich-vu .thong-tin-ca-nhan .row-one{


        }
        .thong-tin-dich-vu .info-row {
            display: flex;
            margin: 8px 0;
            align-items: flex-start;
        }

        .thong-tin-dich-vu .info-row label {
            font-weight: 600;
            color: black;
            min-width: 120px; /* Thêm dòng này để căn đều */
            flex-shrink: 0;
        }

        .thong-tin-dich-vu .info-row span {
            flex: 1;
            word-break: break-word; /* Dùng thay cho word-wrap để tốt hơn */
        }

        .thong-tin-dich-vu .hinh-anh-minh-hoa{
            margin: 10px 5px 5px 10px;

        }
        .thong-tin-dich-vu .hinh-anh-minh-hoa img{
            margin: 5px;
            width: 180px;
            height: 230px;
            border-radius: 10px;
            box-shadow: 5px 5px 10px 2px rgba(220, 217, 217, 0.5);
            border: 1px solid #435ebe ;
        }
        .quay-ve{

            background-color: #435ebe;
            color: white;
            width: 100px;
            margin: 0 auto 10px auto;

        }

        .quay-ve:hover {
            background-color: #768ad3;
        }
    </style>
</head>

<body>
<div id="app">
    <!--    Thêm sidebar-->
    <div th:replace="layout/admin/sidebar :: sidebarAdminFragment"></div>

    <div id="main">
        <!--        Thêm header-->
        <div th:replace="layout/admin/header :: headerAdminFragment"></div>

        <div class="page-heading">
            <h3>Thông tin dịch vụ</h3>
        </div>
        <div class="page-content">
            <section class="section">
                <div class="card">
                    <div class="thong-tin-dich-vu" >
                        <div class="thong-tin-ca-nhan">
                            <div class="row-one">
                                <div class="info-row">
                                    <label>Tên dịch vụ: </label>
                                    <span th:text="${ServicePackageDTO.getServiceName()}" ></span>
                                </div>
                                <div class="info-row">
                                    <label>Mô tả: </label>
                                    <span th:text="${ServicePackageDTO.getServiceDescription()}"></span>
                                </div>
                                <div class="info-row">
                                    <label>Loại bệnh nhân: </label>
                                    <span th:text="${ServicePackageDTO.getPatientType()}"></span>
                                </div>
                                <div class="info-row">
                                    <label>Số buổi điều trị:</label>
                                    <span th:text="${ServicePackageDTO.getNumberOfTreatmentSessions()}"></span>
                                </div>
                                <div class="info-row">
                                    <label>Giá tiền: </label>
                                    <span th:text="${ServicePackageDTO.getPrice()}"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <a th:href="@{/admin/servicepackage/index}" class="btn  quay-ve">Quay về</a>
                </div>
            </section>
        </div>


        <!--        Thêm footer-->
        <div th:replace="layout/admin/footer :: footerAdminFragment"></div>

    </div>
</div>

<script th:src="@{/admin/vendors/perfect-scrollbar/perfect-scrollbar.min.js}"></script>
<script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script>

<script th:src="@{/admin/vendors/apexcharts/apexcharts.js}"></script>
<script th:src="@{/admin/js/pages/dashboard.js}"></script>

<script th:src="@{/admin/js/main.js}"></script>
</body>

</html>
