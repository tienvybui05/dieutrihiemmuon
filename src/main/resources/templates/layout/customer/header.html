                <div sec:authorize="isAnonymous()">
                    <a href="login" class="btn btn-primary py-2 px-4 ms-3">Đăng nhập</a>
                    <a href="register" class="btn btn-primary py-2 px-4 ms-3">Đăng ký</a>
                </div>

                <!-- Đã đăng nhập -->
                <div class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a href="#" class="nav-link dropdown-toggle d-flex align-items-center" data-bs-toggle="dropdown"
                        style="color: #fff;">
                        <i class="fa fa-user me-2"></i>
                        <span style="color: #fff;">Tên người dùng</span>
                    </a>
                    <div class="dropdown-menu m-0">
                        <a href="profile" class="dropdown-item">Thông tin cá nhân</a>

                            <button type="submit"  class="dropdown-item">Đăng xuất</button>
                        </form>

    </div>

    <!-- Modal đổi mật khẩu -->
    <div class="modal fade" id="changePasswordModal" tabindex="-1" aria-labelledby="changePasswordLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content p-4">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold" id="changePasswordLabel">Đổi mật khẩu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Đóng"></button>
                </div>
                <div class="modal-body">
                    <form method="post" th:action="@{/change-password}">
                        <div class="mb-3">
                            <input type="password" class="form-control" name="oldPassword" placeholder="Mật khẩu cũ"
                                required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" name="newPassword" placeholder="Mật khẩu mới"
                                required>
                        </div>
                        <div class="mb-3">
                            <input type="password" class="form-control" name="confirmPassword"
                                placeholder="Xác nhận mật khẩu" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Đổi mật khẩu</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
