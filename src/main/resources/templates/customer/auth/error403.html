<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>403 - Truy cập bị từ chối</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f8f8f8;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            color: #333;
        }

        h1 {
            font-size: 6rem;
            margin-bottom: 0.5rem;
            color: #e74c3c;
        }

        h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.1rem;
            color: #666;
        }

        a {
            margin-top: 2rem;
            display: inline-block;
            text-decoration: none;
            color: #3498db;
            font-weight: bold;
            border: 2px solid #3498db;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            transition: 0.3s;
        }

        a:hover {
            background-color: #3498db;
            color: white;
        }

</head>

<p>Bạn không có quyền truy cập vào trang này.<br/>
    Vui lòng kiểm tra quyền hoặc liên hệ với quản trị viên.</p>
<a th:href="@{/}">Quay lại trang chủ</a>
