<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8">
    <title>Thông tin tài khoản</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Profile Page">
    <meta name="description" content="User Profile">

    <link th:href="@{customer/img/favicon.ico}" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rubik:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link th:href="@{customer/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">
    <link th:href="@{customer/lib/animate/animate.min.css}" rel="stylesheet">
    <link th:href="@{customer/css/bootstrap.min.css}" rel="stylesheet">
    <link th:href="@{customer/css/style.css}" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #dbeafe, #fef3c7);
        }

        .profile-card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .form-input {
            background-color: #dcdcdc;
            border-radius: 10px;
            height: 48px;
            border: 1px solid #eee;
            padding-left: 15px;
        }

        .email-section {
            background-color: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
        }

        .btn-link {
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div th:replace="layout/customer/header :: headerFragment"></div>

    <main>
        <div class="container-fluid bg-primary py-5 bg-header" style="margin-bottom: 90px;">
            <div class="row py-5">
                <div class="col-12 pt-lg-5 mt-lg-5 text-center">
                    <h1 class="display-4 text-white animated zoomIn">Thông tin tài khoản</h1>
                    <a href="#" class="h5 text-white">Home</a>
                    <i class="far fa-circle text-white px-2"></i>
                    <a href="#" class="h5 text-white">Thông tin tài khoản</a>
                </div>
            </div>
        </div>

        <form th:action="@{/profile}" th:object="${user}" method="post">
            <div class="container my-5">
                <div class="profile-card shadow rounded-4 p-4 bg-white">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h4>Xin chào, <span th:text="*{fullName}">Amanda</span></h4>
                            <small class="text-muted"
                                th:text="${#dates.format(#dates.createNow(), 'EEE, dd MMM yyyy')}">
                                Ngày hôm nay
                            </small>
                        </div>
                        <div id="actionButtons">
                            <!-- Nút “Lưu” màu xanh lá (success), “Hủy” màu xám (secondary) -->
                            <button type="submit" class="btn btn-success px-4" style="border-radius: 10px">
                                💾 Lưu
                            </button>
                            <button type="button" class="btn btn-outline-secondary px-4" style="border-radius: 10px"
                                onclick="location.reload()">↩️ Hủy</button>
                        </div>
                    </div>

                    <!-- Thông báo lưu thành công -->
                    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        ✅ <strong>Thành công!</strong> Thông tin tài khoản đã được cập nhật.
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-3 text-center">
                            <img src="https://via.placeholder.com/120" class="rounded-circle mb-2" alt="Avatar"
                                width="120">
                            <h5 class="mb-0" th:text="*{fullName}">Alexa Rawles</h5>
                            <small class="text-muted" th:text="*{email}">alexarawles@gmail.com</small>
                        </div>
                        <div class="col-md-9">
                            <div class="row g-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Họ tên</label>
                                    <input type="text" class="form-control" th:field="*{fullName}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Tên tài khoản</label>
                                    <input type="text" class="form-control" th:field="*{userName}" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Ngày sinh</label>
                                    <input type="date" class="form-control" th:field="*{dateOfBirth}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Email</label>
                                    <input type="email" class="form-control" th:field="*{email}" readonly>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Số điện thoại</label>
                                    <input type="text" class="form-control" th:field="*{phoneNumber}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Địa chỉ</label>
                                    <input type="text" class="form-control" th:field="*{address}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Giới Tính</label>
                                    <input type="text" class="form-control" th:field="*{gender}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold">Nghiệp vụ</label>
                                    <input type="text" class="form-control" th:field="*{role}" readonly>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </form>

    </main>

    <div th:replace="layout/customer/footer :: footerFragment"></div>

    <a href="#" class="btn btn-lg btn-primary btn-lg-square rounded back-to-top">
        <i class="bi bi-arrow-up"></i>
    </a>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{customer/lib/wow/wow.min.js}"></script>
    <script th:src="@{customer/lib/easing/easing.min.js}"></script>
    <script th:src="@{customer/lib/waypoints/waypoints.min.js}"></script>
    <script th:src="@{customer/lib/counterup/counterup.min.js}"></script>
    <script th:src="@{customer/lib/owlcarousel/owl.carousel.min.js}"></script>
    <script th:src="@{customer/js/main.js}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            console.log('DOM loaded');
            const editBtn = document.getElementById('editBtn');
            const saveBtn = document.getElementById('saveBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const form = document.querySelector('form');

            if (!editBtn) {
                console.error('Không tìm thấy nút Sửa (editBtn)');
            }

            editBtn.addEventListener('click', () => {
                console.log('Đã bấm Sửa');
                form.querySelectorAll('input').forEach(el => {
                    el.removeAttribute('readonly');
                    el.classList.remove('form-input'); // Nếu class này làm input disable
                    el.classList.add('editable-input'); // Thêm class riêng để style input khi edit
                });
                form.querySelectorAll('select, textarea').forEach(el => el.removeAttribute('disabled'));
                editBtn.classList.add('d-none');
                saveBtn.classList.remove('d-none');
                cancelBtn.classList.remove('d-none');
            });


            cancelBtn.addEventListener('click', () => {
                location.reload();
            });
        });
    </script>

</body>

</html>
