<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8">
    <title>Startup - Startup Website Template</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Free HTML Templates">
    <meta name="description" content="Free HTML Templates">

    <!-- Favicon -->
    <link th:href="@{customer/img/favicon.ico}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rubik:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{customer/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">
    <link th:href="@{customer/lib/animate/animate.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{customer/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{customer/css/style.css}" rel="stylesheet">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #dbeafe, #fef3c7);
            /*background-attachment: fixed;*/
            /*background-size: cover;*/
            /*backdrop-filter: blur(2px);*/
            /*-webkit-backdrop-filter: blur(2px);*/
            /*min-height: 100vh;*/
        }

        .profile-card {
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .form-input {
            background-color: #dcdcdc;
            border-radius: 10px;
            height: 48px;
            border: 1px solid #eee;
            padding-left: 15px;
        }

        .email-section {
            background-color: #f9f9f9;
            border-radius: 12px;
            padding: 20px;
        }

        .btn-link {
            text-decoration: none;
            font-weight: 600;
        }
    </style>

</head>

<body>
    <!-- Gọi header -->
    <div th:replace="layout/customer/header :: headerFragment"></div>

    <!-- Nội dung chính -->
    <main>
        <div class="container-fluid bg-primary py-5 bg-header" style="margin-bottom: 90px;">
            <div class="row py-5">
                <div class="col-12 pt-lg-5 mt-lg-5 text-center">
                    <h1 class="display-4 text-white animated zoomIn">Thông tin tài khoản</h1>
                    <a href="#" class="h5 text-white">Home</a>
                    <i class="far fa-circle text-white px-2"></i>
                    <a href="#" class="h5 text-white">Thông tin tài khoản</a>
                </div>
            </div>
        </div>
        <div class="container my-5">
            <div class="profile-card shadow rounded-4 p-4 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h4>Xin chào, <span th:text="${user.fullName}">Amanda</span></h4>
                        <small class="text-muted" th:text="${#dates.format(#dates.createNow(), 'EEE, dd MMM yyyy')}">
                            Tue, 07 June 2022
                        </small>
                    </div>
                    <button class="btn btn-primary px-4" style="border-radius: 10px">Sửa</button>
                </div>

                <div class="row mb-4">
                    <div class="col-md-3 text-center">
                        <img src="https://via.placeholder.com/120" class="rounded-circle mb-2" alt="Avatar" width="120">
                        <h5 class="mb-0" th:text="${user.fullName}">Alexa Rawles</h5>
                        <small class="text-muted" th:text="${user.email}">alexarawles@gmail.com</small>
                    </div>
                    <div class="col-md-9">
                        <div class="row g-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Họ tên</label>
                                <input type="text" class="form-control form-input" th:value="${user.fullName}" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Tên tài khoản</label>
                                <input type="text" class="form-control form-input" th:value="${user.userName}" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Ngày sinh</label>
                                <input type="text" class="form-control form-input" th:value="${user.dateOfBirth}"
                                    readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Email</label>
                                <input type="text" class="form-control form-input" th:value="${user.email}" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Số điện thoại</label>
                                <input type="text" class="form-control form-input" th:value="${user.phoneNumber}"
                                    readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Địa chỉ</label>
                                <input type="text" class="form-control form-input" th:value="${user.address}" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Giới Tính</label>
                                <input type="text" class="form-control form-input" th:value="${user.gender}" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Nghiệp vụ</label>
                                <input type="text" class="form-control form-input" th:value="${user.role}" readonly>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="email-section mt-4">
                    <h5 class="fw-bold mb-3">Địa chỉ Email của tôi</h5>
                    <div class="d-flex align-items-center gap-3">
                        <i class="bi bi-envelope-fill fs-4 text-primary"></i>
                        <div>
                            <div th:text="${user.email}">alexarawles@gmail.com</div>
                        </div>
                    </div>
                    <button class="btn btn-link text-primary mt-3">+ Đổi Email</button>
                </div>
            </div>
        </div>




    </main>

    <!-- Gọi footer -->
    <div th:replace="layout/customer/footer :: footerFragment"></div>

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square rounded back-to-top">
        <i class="bi bi-arrow-up"></i>
    </a>

    <!-- JavaScript Libraries -->
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{customer/lib/wow/wow.min.js}"></script>
    <script th:src="@{customer/lib/easing/easing.min.js}"></script>
    <script th:src="@{customer/lib/waypoints/waypoints.min.js}"></script>
    <script th:src="@{customer/lib/counterup/counterup.min.js}"></script>
    <script th:src="@{customer/lib/owlcarousel/owl.carousel.min.js}"></script>

    <!-- Template Javascript -->
    <script th:src="@{customer/js/main.js}"></script>

</body>

</html>
