<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8">
    <title>Lịch làm việc</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Free HTML Templates">
    <meta name="description" content="Free HTML Templates">

    <!-- Favicon -->
    <link th:href="@{customer/img/favicon.ico}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rubik:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{customer/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">
    <link th:href="@{customer/lib/animate/animate.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{customer/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{customer/css/style.css}" rel="stylesheet">
    <style>
        .lich-lam-viec-bac-si {
            padding: 5px 30px;
            background-color: #ffffff;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }
        .table-wrapper {
            width: 100%;
            overflow-x: hidden; /* Không cho cuộn ngang */
            box-shadow: 0 10px 12px rgba(0, 0, 0, 0.1);
        }

        .scroll-container {
            max-height: 450px; /* Chiều cao cuộn dọc */
            overflow-y: auto;
            overflow-x: hidden; /* Ngăn cuộn ngang */
        }

        .bang-lich-lam {
            table-layout: fixed;  /* Bắt buộc để cột không co giãn lung tung */
            width: 100%;
            border-collapse: collapse;
        }

        .bang-lich-lam th,
        .bang-lich-lam td {
            padding: 8px;
            border: 1px solid #06A3DA;
            word-wrap: break-word;
            white-space: normal;
        }
        .scroll-container::-webkit-scrollbar {
            width: 10px;
        }

        .scroll-container::-webkit-scrollbar-track {
            background: white; /* Màu nền thanh cuộn */
            border-radius: 10px;
        }

        .scroll-container::-webkit-scrollbar-thumb {
            background-color: #06A3DA; /* Màu nút kéo */
            border-radius: 10px;
            border: 2px solid #FFFFFF; /* Viền tạo hiệu ứng padding */
        }

        .scroll-container::-webkit-scrollbar-thumb:hover {
            background-color: #06A3DA; /* Màu khi hover */
        }
        .bang-lich-lam {
            width: 100%;
            border-collapse: collapse;
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
            background-color: #ffffff;
        }

        .bang-lich-lam th {
            background-color: #06A3DA; /* Blue primary */
            color: #ffffff;
            text-align: center;
            padding: 12px 10px;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #e0e0e0;
        }

        .bang-lich-lam td {
            text-align: center;
            padding: 10px 8px;
            font-size: 14px;
            border: 1px solid #e0e0e0;
            color: #333;
            background-color:#FFFFFF;
            font-size: 13px;
            font-weight: 500;
        }

        .bang-lich-lam tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .bang-lich-lam tr:hover {
            background-color: #e9f2ff;
            transition: 0.2s ease-in-out;
        }

        .bang-lich-lam a {
            display: inline-block;
            background-color: #06A3DA;
            color: #ffffff;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
        }

        .bang-lich-lam a:hover {
            background-color: #0b5ed7; /* Màu xanh hover đậm hơn */
            text-decoration: none;
        }

        .bang-lich-lam button {
            background-color:#06A3DA; /* Bootstrap success green */
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
        }

        .bang-lich-lam button:hover {
            background-color: #01cdb6;
        }
        .quay-ve-lịch-lam {
            text-align: center;
        }

        .quay-ve-lịch-lam a {
            text-decoration: none;
            color: #06A3DA;
            font-weight: bold;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        .quay-ve-lịch-lam a:hover {
            color: #1b5dc9;
        }
        .text-success {
            color: #06A3DA;
            font-weight: bold;
        }
        .text-danger {
            color: red;
            font-weight: bold;
        }
        .note-popup {
            width: 300px;
            border-radius: 10px;
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: white;
            padding: 20px;
            z-index: 1000;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }
        .note-popup textarea {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border-radius: 8px;
            border: 1px solid #ccc;
            resize: vertical;
            margin-bottom: 2px;
        }
        .no-scroll {
            overflow: hidden;
        }
        .tim-kiem-theo-ngay{
            margin-bottom: 10px;

        }
        .loc-va-thong-tin{
            display: flex;
            justify-content: space-between;
        }
        .loc form select{
            background-color:white; /* Bootstrap success green */
            color: #06A3DA;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 10px;
            border: 1px solid #06A3DA;
        }
        .loc form select option{
            background-color:white; /* Bootstrap success green */
            color: #06A3DA;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 10px;
            border: 1px solid #06A3DA;
        }
        .loc form select option:hover{
            background-color:#06A3DA;
            color: white;
        }
        .loc form button{
            background-color:#06A3DA; /* Bootstrap success green */
            color: white;
            border: none;
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 10px;
        }
        .loc form button:hover{
            background-color: #01cdb6;
        }
        .loc-va-thong-tin .thong-tin-lich-hom-nay{
            padding: 0 10px;
        }
        .loc-va-thong-tin .thong-tin-lich-hom-nay li{
            color: #06A3DA ;
        }
        .loc-va-thong-tin .thong-tin-lich-hom-nay .info-row span{
            color: red;
        }
    </style>

</head>

<body>
<!-- Gọi header -->
<div th:replace="layout/customer/header :: headerFragment"></div>

<!-- Nội dung chính -->
<main>
    <div class="container-fluid bg-primary py-5 bg-header" style="margin-bottom: 90px;">
        <div class="row py-5">
            <div class="col-12 pt-lg-5 mt-lg-5 text-center">
                <h1 class="display-4 text-white animated zoomIn">Lịch làm việc</h1>
                <a href="" class="h5 text-white">Home</a>
                <i class="far fa-circle text-white px-2"></i>
                <a href="" class="h5 text-white">About</a>
            </div>
        </div>
    </div>

    <div class="lich-lam-viec-bac-si">
        <div class="loc-va-thong-tin">
            <div class="thong-tin-lich-hom-nay">
                <label style="color: #fa0000">Lịch khám hôm nay</label>
                <ul>
                    <li><div class="info-row">
                        <label >Số lịch khám:</label>
                        <span th:text="${numberSchedule.numberOfCalendarsPerDay}"></span>
                    </div></li>
                    <li><div class="info-row">
                        <label >Số lịch đã thực hiện:</label>
                        <span th:text="${numberSchedule.done}"></span>
                    </div></li>
                    <li><div class="info-row">
                        <label >Số lịch chưa thực hiện:</label>
                        <span th:text="${numberSchedule.notYetImplemented}"></span>
                    </div></li>
                </ul>
            </div>
            <div class="loc">
                <form th:action="@{/workscheduledoctor}" method="get">
                    <select name="filter">
                        <option value="all" th:selected="${currentFilter == 'all'}">Hiện tất cả lịch</option>
                        <option value="today" th:selected="${currentFilter == 'today'}">Lịch khám hôm nay</option>
                    </select>
                    <button type="submit">Tìm</button>
                </form>
            </div>
        </div>
        <div class="table-wrapper">
            <table class="bang-lich-lam">
                <thead>
                <tr>
                    <th>Mã lịch</th>
                    <th>Khách hàng</th>
                    <th>Dịch vụ</th>
                    <th>Giá</th>
                    <th>Ngày đặt dịch vụ</th>
                    <th>Xác nhận</th>
                    <th>Thực hiện</th>
                    <th>Ghi chú tổng quan</th>
                    <th>Chu kì điều trị</th>
                    <th></th>
                </tr>
                </thead>
            </table>

            <div class="scroll-container">
                <table class="bang-lich-lam">
                    <tbody>
                    <tr th:each="wsd : ${scheduleList}">
                        <td th:text="${wsd.idSchedule}"></td>
                        <td th:text="${wsd.nameCustomer}"></td>
                        <td th:text="${wsd.nameService}"></td>
                        <td th:text="${#numbers.formatDecimal(wsd.price, 0, 'POINT', 0, 'POINT')} + 'đ' "></td>
                        <td th:text="${wsd.serviceBookingDate}"></td>
                        <td class="trang-thai-xac-nhan"
                            th:text="${wsd.confirmationStatus}"
                            th:classappend="${wsd.confirmationStatus == 'Đã xác nhận'} ? ' text-success' : ' text-danger'">
                        </td>
                        <td class="trang-thai-hoan-thanh"
                            th:text="${wsd.executionStatus}"
                            th:classappend="${wsd.executionStatus == 'Đã thực hiện'} ? ' text-success' : ' text-danger'">
                        </td>
                        <td th:text="${wsd.generalNotes}"></td>
                        <td>
                            <a th:href="@{/treatmentcycledoctor/{id}(id=${wsd.getIdSchedule()})}">Xem</a>
                        </td>
                        <td>
                            <button type="button"
                                    th:attr="onclick='showNoteForm(&quot;noteForm_' + ${wsd.idSchedule} + '&quot;)'">
                                Ghi chú
                            </button>
                            <div th:attr="id='noteForm_' + ${wsd.idSchedule}" class="note-popup">
                                <form method="post" th:action="@{/saveGeneralNotes}">
                                    <input type="hidden" name="id" th:value="${wsd.idSchedule}" />
                                    <label>Ghi chú tổng quan:</label><br>
                                    <textarea name="note" rows="4" cols="30"></textarea><br><br>
                                    <button type="submit">Lưu</button>
                                    <button type="button"
                                            th:attr="onclick='hideNoteForm(&quot;noteForm_' + ${wsd.idSchedule} + '&quot;)'">
                                        Đóng
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>
    <!-- Navbar & Carousel End -->
</main>

<!-- Gọi footer -->
<div th:replace="layout/customer/footer :: footerFragment"></div>

<!-- Back to Top -->
<a href="#" class="btn btn-lg btn-primary btn-lg-square rounded back-to-top">
    <i class="bi bi-arrow-up"></i>
</a>
<script>
    function showNoteForm(id) {
        document.getElementById(id).style.display = 'block';
        document.body.classList.add('no-scroll');
    }

    function hideNoteForm(id) {
        document.getElementById(id).style.display = 'none';
        document.body.classList.remove('no-scroll');
    }
    function syncTableWidths() {
        const headerTable = document.querySelector('.table-wrapper table.bang-lich-lam');
        const bodyTable = document.querySelector('.scroll-container table.bang-lich-lam');

        if (!headerTable || !bodyTable) return;

        const headerCols = headerTable.querySelectorAll('th');
        const bodyCols = bodyTable.querySelectorAll('tr:first-child td');

        if (headerCols.length !== bodyCols.length) return;

        for (let i = 0; i < headerCols.length; i++) {
            const width = Math.max(headerCols[i].offsetWidth, bodyCols[i]?.offsetWidth || 0);
            headerCols[i].style.width = width + 'px';
            bodyCols[i].style.width = width + 'px';
        }
    }

    window.addEventListener('load', syncTableWidths);
    window.addEventListener('resize', syncTableWidths);
</script>
<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{customer/lib/wow/wow.min.js}"></script>
<script th:src="@{customer/lib/easing/easing.min.js}"></script>
<script th:src="@{customer/lib/waypoints/waypoints.min.js}"></script>
<script th:src="@{customer/lib/counterup/counterup.min.js}"></script>
<script th:src="@{customer/lib/owlcarousel/owl.carousel.min.js}"></script>

<!-- Template Javascript -->
<script th:src="@{customer/js/main.js}"></script>

</body>
</html>
