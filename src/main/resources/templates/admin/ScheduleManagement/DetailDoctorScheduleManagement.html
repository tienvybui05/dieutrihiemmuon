<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mazer Admin Dashboard</title>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/admin/css/bootstrap.css}">

    <link rel="stylesheet" th:href="@{/admin/vendors/iconly/bold.css}">

    <link rel="stylesheet" th:href="@{/admin/vendors/perfect-scrollbar/perfect-scrollbar.css}">
    <link rel="stylesheet" th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/admin/css/app.css}">
    <link rel="shortcut icon" th:href="@{/admin/images/favicon.svg}" type="image/x-icon">
    <link rel="stylesheet"  th:href="@{/admin/vendors/simple-datatables/style.css}">
    <style>

        .admin-hanh-dong a {
            display: inline-block;
            padding: 5px 8px;
            margin: 4px 1px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            color: #FFFFFF;
        }

    </style>
</head>

<body>
<div id="app">
    <!--    Thêm sidebar-->
    <div th:replace="layout/admin/sidebar :: sidebarAdminFragment"></div>

    <div id="main">
        <!--        Thêm header-->
        <div th:replace="layout/admin/header :: headerAdminFragment"></div>

        <div class="page-heading">
            <h3>Xem lịch làm việc bác sĩ</h3>
        </div>
        <div class="page-content">
            <section class="section">
                <div class="card">
                    <div class="card-header bg-light d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 text-primary fw-bold">Lịch làm việc bác sĩ</h5>
                        <div class="text-end">
                                                <span class="fw-bold text-dark">
                                <i class="bi bi-person text-success"></i> Bệnh nhân: <span class="text-success" th:text="${nameCustomer}">Nguyễn Văn A</span>
                            </span>
                        </div>
                    </div>

                    <div class="card-body">
                        <table class="table table-striped" id="table1">
                            <thead>
                            <tr>
                                <th>Buổi</th>
                                <th>Ngày</th>
                                <th>Ghi chú</th>
                                <th>Trạng thái</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="buoi : ${sessionList}">
                                <td th:text="${buoi.treatmentTime}"></td>
                                <td th:text="${buoi.treatmentDay}"></td>
                                <td th:text="${buoi.note}"></td>
                                <td th:text="${buoi.treatmentStatus}"></td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </section>
        </div>


        <!--        Thêm footer-->
        <div th:replace="layout/admin/footer :: footerAdminFragment"></div>

    </div>
</div>

{% block js %}
<script th:src="@{/admin/vendors/simple-datatables/simple-datatables.js}"></script>
<script>
    // Simple Datatable
    let table1 = document.querySelector('#table1');
    let dataTable = new simpleDatatables.DataTable(table1);
</script>
{% endblock %}
<script th:src="@{/admin/vendors/perfect-scrollbar/perfect-scrollbar.min.js}"></script>
<script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script>

<script th:src="@{/admin/vendors/apexcharts/apexcharts.js}"></script>
<script th:src="@{/admin/js/pages/dashboard.js}"></script>

<script th:src="@{/admin/js/main.js}"></script>

<!-- JS -->
<script th:src="@{/admin/vendors/simple-datatables/simple-datatables.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const table = document.querySelector('#tableLichKham');
        if (table) new simpleDatatables.DataTable(table);

        // Tô màu trạng thái
        document.querySelectorAll('.trang-thai').forEach(function (el) {
            const text = el.textContent.trim().toLowerCase();
            if (text.includes("hoàn thành")) {
                el.style.color = '#28a745'; // xanh lá
            } else if (text.includes("chưa thực hiện")) {
                el.style.color = '#ffc107'; // vàng
            } else {
                el.style.color = '#6c757d'; // xám
            }
        });
    });
</script>

</body>

</html>
