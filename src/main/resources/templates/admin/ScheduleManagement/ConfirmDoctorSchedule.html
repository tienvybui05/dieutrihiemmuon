<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Mazer Admin Dashboard</title>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/admin/css/bootstrap.css}">

    <link rel="stylesheet" th:href="@{/admin/vendors/iconly/bold.css}">

    <link rel="stylesheet" th:href="@{/admin/vendors/perfect-scrollbar/perfect-scrollbar.css}">
    <link rel="stylesheet" th:href="@{/admin/vendors/bootstrap-icons/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/admin/css/app.css}">
    <link rel="shortcut icon" th:href="@{/admin/images/favicon.svg}" type="image/x-icon">
    <link rel="stylesheet"  th:href="@{/admin/vendors/simple-datatables/style.css}">
    <style>

        .admin-hanh-dong a {
            display: inline-block;
            padding: 5px 8px;
            margin: 4px 1px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            transition: all 0.3s ease;
            font-family: 'Segoe UI', sans-serif;
            font-size: 14px;
            color: #FFFFFF;
        }


        .admin-chi-tiet {
            background-color: #b700c1;

        }

        .admin-chi-tiet:hover {
            background-color: #c0f8cf;
        }

    </style>
</head>

<body>
<div id="app">
    <!--    Thêm sidebar-->
    <div th:replace="layout/admin/sidebar :: sidebarAdminFragment"></div>

    <div id="main">
        <!--        Thêm header-->
        <div th:replace="layout/admin/header :: headerAdminFragment"></div>

        <div class="page-heading">
            <h3>Xác nhận lịch làm việc bác sĩ</h3>
        </div>
        <div class="page-content">
            <section class="section">
                <div class="card">
                    <div class="card-body">
                        <table class="table table-striped" id="table1">
                            <thead>
                            <tr>
                                <th>Khách hàng</th>
                                <th>Dịch vụ</th>
                                <th>Giá</th>
                                <th>Ngày đặt</th>
                                <th>Xác nhận</th>
                                <th>Thực hiện</th>
                                <th>Ghi chú</th>
                                <th>Chu kỳ</th>
                                <th>Hành động</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="wsd : ${scheduleList}">
                                <td th:text="${wsd.nameCustomer}"></td>
                                <td  th:text="${wsd.nameService}"></td>
                                <td  th:text="${wsd.price}"></td>
                                <td  th:text="${wsd.serviceBookingDate}"></td>
                                <td class="trang-thai-xac-nhan"
                                    th:text="${wsd.confirmationStatus}"
                                    th:classappend="${wsd.confirmationStatus == 'Đã xác nhận'} ? ' text-success' : ' text-danger'">
                                </td>
                                <td class="trang-thai-hoan-thanh"
                                    th:text="${wsd.executionStatus}"
                                    th:classappend="${wsd.executionStatus == 'Đã thực hiện'} ? ' text-success' : ' text-danger'">
                                </td>
                                <td th:text="${wsd.generalNotes}"></td>
                                <td class="admin-hanh-dong">
                                    <a class="admin-chi-tiet" th:href="@{/admin/ScheduleManagement/DetailDoctorScheduleManagement/{id}(id=${wsd.getIdSchedule()})}">Xem</a>
                                </td>
                                <td class="admin-hanh-dong">
                                    <form th:action="@{/admin/ScheduleManagement/ConfirmDoctorSchedule/{id}(id=${wsd.getIdSchedule()})}" method="post">
                                        <input type="hidden" name="doctorId" th:value="${wsd.getIdDoctor()}" />
                                        <button type="submit"
                                                class="btn btn-sm btn-outline-success"
                                                th:disabled="${wsd.confirmationStatus == 'Đã xác nhận'}">
                                            Xác nhận
                                        </button>
                                    </form>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>

            </section>
        </div>


        <!--        Thêm footer-->
        <div th:replace="layout/admin/footer :: footerAdminFragment"></div>

    </div>
</div>

{% block js %}
<script th:src="@{/admin/vendors/simple-datatables/simple-datatables.js}"></script>
<script>
    // Simple Datatable
    let table1 = document.querySelector('#table1');
    let dataTable = new simpleDatatables.DataTable(table1);
</script>
{% endblock %}
<script th:src="@{/admin/vendors/perfect-scrollbar/perfect-scrollbar.min.js}"></script>
<script th:src="@{/admin/js/bootstrap.bundle.min.js}"></script>

<script th:src="@{/admin/vendors/apexcharts/apexcharts.js}"></script>
<script th:src="@{/admin/js/pages/dashboard.js}"></script>

<script th:src="@{/admin/js/main.js}"></script>

<!-- JS -->
<script th:src="@{/admin/vendors/simple-datatables/simple-datatables.js}"></script>
<script>
    document.addEventListener('DOMContentLoaded', function () {

        function applyTextColorByContent(selector, colorMap, defaultColor) {
            document.querySelectorAll(selector).forEach(function (cell) {
                const text = cell.textContent.trim().toLowerCase();
                cell.style.color = colorMap[text] || defaultColor;
            });
        }

        const colorMap = {
            'đã xác nhận': '#28a745',
            'chưa xác nhận': '#dc3545',
            'đã thanh toán': '#007bff',
            'chưa thanh toán': '#dc3545'
        };

        applyTextColorByContent('.trang-thai-xac-nhan', colorMap, '#6c757d');
        applyTextColorByContent('.trang-thai-thanh-toan', colorMap, '#6c757d');
    });
</script>

</body>

</html>
