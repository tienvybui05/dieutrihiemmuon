<!doctype html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">
<head xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8">
    <title>Bác sĩ</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Free HTML Templates">
    <meta name="description" content="Free HTML Templates">

    <!-- Favicon -->
    <link th:href="@{/customer/img/favicon.ico}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rubik:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{/customer/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">
    <link th:href="@{/customer/lib/animate/animate.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/customer/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{/customer/css/style.css}" rel="stylesheet">
    <style>
        .owl-carousel .team-item {
            margin-right: 30px;
        }
        .team-item .p-4 {
            min-height: 200px;
        }

    </style>
</head>

<body>
<!-- Gọi header -->
<div th:replace="layout/customer/header :: headerFragment"></div>

<!-- Nội dung chính -->
<main>
    <div class="container-fluid bg-primary py-5 bg-header" style="margin-bottom: 90px;">
        <div class="row py-5">
            <div class="col-12 pt-lg-5 mt-lg-5 text-center">
                <h1 class="display-4 text-white animated zoomIn">Bác sĩ</h1>
                <a href="#" class="h5 text-white">Home</a>
                <i class="far fa-circle text-white px-2"></i>
                <a href="#" class="h5 text-white">Bác sĩ</a>
            </div>
        </div>
    </div>
    <!-- Team Start -->
    <div class="container-fluid py-5 wow fadeInUp" data-wow-delay="0.1s">
        <div class="container py-5">
            <div class="section-title text-center position-relative pb-3 mb-5 mx-auto" style="max-width: 600px;">
                <h5 class="fw-bold text-primary text-uppercase">Đội Ngũ Y Bác Sĩ Uy Tín</h5>
                <h1 class="mb-0">Chuyên Gia Điều Trị Hiếm Muộn Hàng Đầu</h1>
            </div>
            <div class="owl-carousel testimonial-carousel wow fadeInUp" data-wow-delay="0.6s">

                <!-- Doctor 1 -->
                <div class="wow slideInUp" data-wow-delay="0.3s" th:each="doctor : ${listDoctor}">
                    <div class="team-item bg-light rounded overflow-hidden">
                        <div class="team-img position-relative overflow-hidden">

                            <img class="img-fluid w-100" th:src="@{'/admin/images/faces/' + ${doctor.image}}" alt="Bác sĩ CKI Sản phụ khoa">
                        </div>
                        <div class="p-4">
                            <h4 class="text-primary mb-1" th:text="${doctor.fullName}"></h4>
                            <div>
                                <p class="text-muted mb-2" style="display: inline">Kinh nghiệm: </p>
                                <p class="text-muted mb-2" th:text="${doctor.experience}" style="display: inline"></p>
                            </div>
                            <strong>Thực hiện gói dịch vụ:</strong>
                            <p class="text-dark mb-0" th:text="${doctor.nameService}"> </p>
                        </div>
                    </div>
                </div>



            </div>
        </div>
    </div>
    <!-- Team End -->

</main>

<!-- Gọi footer -->
<div th:replace="layout/customer/footer :: footerFragment"></div>

<!-- Back to Top -->
<a href="#" class="btn btn-lg btn-primary btn-lg-square rounded back-to-top">
    <i class="bi bi-arrow-up"></i>
</a>


<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/customer/lib/wow/wow.min.js}"></script>
<script th:src="@{/customer/lib/easing/easing.min.js}"></script>
<script th:src="@{/customer/lib/waypoints/waypoints.min.js}"></script>
<script th:src="@{/customer/lib/counterup/counterup.min.js}"></script>
<script th:src="@{/customer/lib/owlcarousel/owl.carousel.min.js}"></script>

<!-- Template Javascript -->
<script th:src="@{/customer/js/main.js}"></script>


</body>
</html>
