<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head xmlns:th="http://www.thymeleaf.org">
    <meta charset="utf-8">
    <title>Startup - Startup Website Template</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="Free HTML Templates">
    <meta name="description" content="Free HTML Templates">

    <!-- Favicon -->
    <link th:href="@{/customer/img/favicon.ico}" rel="icon">

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Icon Font Stylesheet -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Libraries Stylesheet -->
    <link th:href="@{/customer/lib/owlcarousel/assets/owl.carousel.min.css}" rel="stylesheet">
    <link th:href="@{/customer/lib/animate/animate.min.css}" rel="stylesheet">

    <!-- Customized Bootstrap Stylesheet -->
    <link th:href="@{/customer/css/bootstrap.min.css}" rel="stylesheet">

    <!-- Template Stylesheet -->
    <link th:href="@{/customer/css/style.css}" rel="stylesheet">
</head>

<body>
<!-- Gọi header -->
<div th:replace="layout/customer/header :: headerFragment"></div>

<!-- Nội dung chính -->
<main>
    <div class="container-fluid bg-primary py-5 bg-header" style="margin-bottom: 90px;">
        <div class="row py-5">
            <div class="col-12 pt-lg-5 mt-lg-5 text-center">
                <h1 class="display-4 text-white animated zoomIn">Đổi mật khẩu</h1>
                <a href="#" class="h5 text-white">Home</a>
                <i class="far fa-circle text-white px-2"></i>
                <a href="#" class="h5 text-white">Đổi mật khẩu</a>
            </div>
        </div>
    </div>

    <!-- Change Password Form Start -->
    <section class="container d-flex justify-content-center align-items-center my-5">
        <div class="card shadow p-4" style="min-width: 400px; max-width: 500px; width: 100%;">
            <h3 class="text-center mb-4 text-primary">Đổi mật khẩu</h3>
            <form method="post" th:action="@{/customer/auth/changepassword}">
                <div class="form-group mb-3 position-relative">
                    <label for="oldPassword" class="form-label">Mật khẩu cũ</label>
                    <input type="password" class="form-control" id="oldPassword" name="oldPassword" placeholder="Nhập mật khẩu cũ" required>
                    <span class="position-absolute end-0 me-3" style="top: 75%; transform: translateY(-50%); cursor: pointer;" onclick="togglePassword('oldPassword', 'eyeIconOld')">
                        <i id="eyeIconOld" class="bi bi-eye-slash"></i>
                    </span>
                </div>
                <div class="form-group mb-3 position-relative">
                    <label for="newPassword" class="form-label">Mật khẩu mới</label>
                    <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="Nhập mật khẩu mới" required>
                    <span class="position-absolute end-0 me-3" style="top: 75%; transform: translateY(-50%); cursor: pointer;" onclick="togglePassword('newPassword', 'eyeIconNew')">
                        <i id="eyeIconNew" class="bi bi-eye-slash"></i>
                    </span>
                </div>
                <div class="form-group mb-3 position-relative">
                    <label for="confirmPassword" class="form-label">Xác nhận mật khẩu</label>
                    <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Xác nhận mật khẩu" required>
                    <span class="position-absolute end-0 me-3" style="top: 75%; transform: translateY(-50%); cursor: pointer;" onclick="togglePassword('confirmPassword', 'eyeIconConfirm')">
                        <i id="eyeIconConfirm" class="bi bi-eye-slash"></i>
                    </span>
                </div>
                <!-- Thông báo lỗi hoặc thành công -->
                <div class="form-group mb-3 position-relative">
                    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>

                    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        <span th:text="${success}"></span>
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                </div>

                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-bold">
                        Đổi mật khẩu
                    </button>
                </div>
            </form>
        </div>
    </section>
    <!-- Change Password Form End -->

    <script>
        function togglePassword(inputId, iconId) {
            const passwordInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.classList.remove("bi-eye-slash");
                eyeIcon.classList.add("bi-eye");
            } else {
                passwordInput.type = "password";
                eyeIcon.classList.remove("bi-eye");
                eyeIcon.classList.add("bi-eye-slash");
            }
        }
    </script>
</main>

<!-- Gọi footer -->
<div th:replace="layout/customer/footer :: footerFragment"></div>

<!-- Back to Top -->
<a href="#" class="btn btn-lg btn-primary btn-lg-square rounded back-to-top">
    <i class="bi bi-arrow-up"></i>
</a>

<!-- JavaScript Libraries -->
<script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/customer/lib/wow/wow.min.js}"></script>
<script th:src="@{/customer/lib/easing/easing.min.js}"></script>
<script th:src="@{/customer/lib/waypoints/waypoints.min.js}"></script>
<script th:src="@{/customer/lib/counterup/counterup.min.js}"></script>
<script th:src="@{/customer/lib/owlcarousel/owl.carousel.min.js}"></script>

<!-- Template Javascript -->
<script th:src="@{/customer/js/main.js}"></script>

</body>
</html>
